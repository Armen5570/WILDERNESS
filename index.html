
<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WILDERNESS</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./game.js"></script>
</head>
<body>
    <div id="game"></div>

    <div id="hud">
        <div class="game-title">WILDERNESS</div>
        <div id="inventory"></div>
    </div>

    <div id="controls">
        <b>ԿԱՌԱՎԱՐՈՒՄ</b><br>
        WASD — Շարժվել<br>
        SHIFT — Վազել<br>
        SPACE — Ցատկել<br>
        E — Հավաքել / մեքենա<br>
        F — Ձկնորսություն<br>
        Q — Լուսանկարել եղնիկին<br>
        1 — Կացին<br>
        2 — Շղթայասղոց<br>
        L — Լապտեր<br>
        Մկնիկ — Նայել<br>
        Ձախ սեղմում — Կտրել ծառը
    </div>

    <div id="tool">Գործիք՝ Ձեռքեր</div>
    <div id="message"></div>
    <div id="crosshair">+</div>

    <script type="module" src="game.js"></script>
</body>
</html>
